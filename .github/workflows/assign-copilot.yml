name: Assign Issue to Copilot

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to assign to Copilot
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: copilot-assignment-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  assign:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'copilot-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and assign Copilot
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          script: |
            const issueNumber = Number(
              context.eventName === "workflow_dispatch"
                ? context.payload.inputs.issue_number
                : context.issue.number,
            );

            const { owner, repo } = context.repo;
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            if (issue.pull_request) {
              core.setFailed(`#${issueNumber} is a pull request, not an issue.`);
              return;
            }
            if (issue.state !== "open") {
              core.setFailed(`#${issueNumber} is not open.`);
              return;
            }

            const labels = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name,
            );
            if (!labels.includes("user-story")) {
              core.setFailed(
                `#${issueNumber} is missing the required user-story label.`,
              );
              return;
            }
            if (!labels.includes("copilot-ready")) {
              core.setFailed(
                `#${issueNumber} requires the copilot-ready human-approval label.`,
              );
              return;
            }

            const assignees = issue.assignees?.map((assignee) =>
              assignee.login.toLowerCase(),
            ) ?? [];
            if (
              assignees.includes("copilot") ||
              assignees.includes("copilot-swe-agent")
            ) {
              core.notice(`#${issueNumber} is already assigned to Copilot.`);
              return;
            }

            const featureHeaders = {
              "GraphQL-Features": "issues_copilot_assignment_api_support",
            };
            const actorQuery = `
              query FindCopilot($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  suggestedActors(
                    capabilities: [CAN_BE_ASSIGNED]
                    first: 100
                  ) {
                    nodes {
                      __typename
                      login
                      ... on Bot { id }
                      ... on User { id }
                    }
                  }
                }
              }
            `;
            const actorResponse = await github.request("POST /graphql", {
              query: actorQuery,
              variables: { owner, repo },
              headers: featureHeaders,
            });

            const actors =
              actorResponse.data.data.repository.suggestedActors.nodes;
            const copilot = actors.find((actor) =>
              ["copilot", "copilot-swe-agent"].includes(
                actor.login.toLowerCase(),
              ),
            );
            if (!copilot?.id) {
              core.setFailed(
                "Copilot coding agent is not assignable in this repository.",
              );
              return;
            }

            const assignmentMutation = `
              mutation AssignCopilot(
                $issueId: ID!
                $assigneeIds: [ID!]!
              ) {
                addAssigneesToAssignable(
                  input: {
                    assignableId: $issueId
                    assigneeIds: $assigneeIds
                  }
                ) {
                  assignable {
                    ... on Issue {
                      id
                      assignees(first: 20) {
                        nodes { id login }
                      }
                    }
                  }
                }
              }
            `;
            const assignmentResponse = await github.request("POST /graphql", {
              query: assignmentMutation,
              variables: {
                issueId: issue.node_id,
                assigneeIds: [copilot.id],
              },
              headers: featureHeaders,
            });

            const assignedActors =
              assignmentResponse.data.data.addAssigneesToAssignable
                .assignable.assignees.nodes;
            const assigned = assignedActors.some(
              (actor) => actor.id === copilot.id,
            );
            if (!assigned) {
              core.setFailed(
                `GitHub did not assign Copilot to issue #${issueNumber}.`,
              );
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ["copilot-assigned"],
            });

            core.notice(
              `Assigned issue #${issueNumber} to GitHub Copilot coding agent.`,
            );
