name: Copilot Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Copilot Review Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Request and verify Copilot review
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          script: |
            const pullNumber = Number(
              context.eventName === "workflow_dispatch"
                ? context.payload.inputs.pull_request_number
                : context.payload.pull_request.number,
            );
            const { owner, repo } = context.repo;
            const reviewer = "copilot-pull-request-reviewer[bot]";

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (pull.state !== "open") {
              core.setFailed(`#${pullNumber} is not an open pull request.`);
              return;
            }

            const headSha = pull.head.sha;
            const labels = pull.labels.map((label) => label.name);

            if (labels.includes("copilot-reviewed")) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pullNumber,
                name: "copilot-reviewed",
              });
            }
            if (!labels.includes("awaiting-copilot-review")) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pullNumber,
                labels: ["awaiting-copilot-review"],
              });
            }

            async function findCurrentReview() {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              return reviews.find(
                (review) =>
                  review.user?.login.toLowerCase() === reviewer &&
                  review.commit_id === headSha,
              );
            }

            let review = await findCurrentReview();
            if (!review) {
              await github.request(
                "POST /repos/{owner}/{repo}/pulls/{pull_number}/requested_reviewers",
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  reviewers: [reviewer],
                },
              );
              core.notice(
                `Requested Copilot review for PR #${pullNumber} at ${headSha}.`,
              );

              for (let attempt = 1; attempt <= 40 && !review; attempt += 1) {
                await new Promise((resolve) => setTimeout(resolve, 15000));
                review = await findCurrentReview();
              }
            }

            if (!review) {
              core.setFailed(
                `Copilot did not review PR #${pullNumber} at ${headSha} within 10 minutes.`,
              );
              return;
            }

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number: pullNumber,
              name: "awaiting-copilot-review",
            });
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullNumber,
              labels: ["copilot-reviewed"],
            });

            core.notice(
              `Verified Copilot review ${review.html_url} for ${headSha}.`,
            );
