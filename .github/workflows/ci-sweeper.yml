name: CI Sweeper Loop

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  sweep:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Record failure context
        if: github.event_name == 'workflow_run'
        run: |
          echo "Failed workflow: ${{ github.event.workflow_run.name }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Run URL: ${{ github.event.workflow_run.html_url }}"

      - name: Update CI sweeper state
        run: |
          {
            echo
            echo "### $(date -u +%Y-%m-%dT%H:%M:%SZ) - CI sweep"
            echo "- Event: ${{ github.event_name }}"
            echo "- Workflow: ${{ github.event.workflow_run.name || 'manual validation' }}"
            echo "- Branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}"
            echo "- URL: ${{ github.event.workflow_run.html_url || github.server_url }}"
            echo "- Loop action: report-only"
          } >> ci-sweeper-state.md

      - name: Invoke CI Sweeper loop
        uses: cobusgreyling/loop-engineering/tools/loop-action@main
        with:
          pattern: ci-sweeper
          level: L2
          sandbox: "false"
          sandbox-shell: "true"
          command: |
            echo "::notice::CI failure context captured for human-guided diagnosis."
            echo "No automated code change or merge is permitted by loop-constraints.md."

      - uses: actions/upload-artifact@v4
        with:
          name: ci-sweeper-state
          path: ci-sweeper-state.md
